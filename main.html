<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div id="workspace">
        <div id="counterShelves">
            <button class="objectBtn" id="cup"></button>
            <button class="objectBtn" id="water"></button>
            <button class="objectBtn" id="raspberryBowl"></button>
            <img class="consumable" id="raspberry" src="Assets/raspberries.png">
            <button class="objectBtn" id="milk"></button>
            <button class="objectBtn" id="lemonBowl"></button>
            <img class="consumable" id="lemon" src="Assets/lemonslice.png">
            <button class="objectBtn" id="cream"></button>

            <div id="customerWrap">
                <img id="customer" src="Assets/frog.png">
            </div>

            <img id="counter" src="Assets/counter.png">

            <div id="order">
                <h4 id="orderHeading">Order</h4>
                <div id="orderText"></div>
                <div id="timerText"></div>
                <button id="serveBtn"></button>

                <p id="score">score: 0</p>
                <p id="message"></p>
            </div>
        </div>
    </div>

    <audio id="bgMusic" src="Assets/mainSong.mp3" loop></audio>
    <button id="musicBtn">Music</button>



    <script src="main.js"></script>

</body>

</html>
